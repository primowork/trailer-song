# ערכת הנושא של האפליקציה. זו הדרך המובנית של Streamlit, ולכן היא חלה גם על
# רכיבים שאין לנו CSS עליהם (בוררים, popover, סרגל הצד) — בניגוד להזרקת CSS,
# שמכסה רק את מה שנזכרנו לכסות.
#
# הערכים הם ערכי כוונה סופיים ולא הצעה: שינוי כאן הוא סטייה מהעיצוב, לא
# כוונון. שני יוצאים מן הכלל: הטיפוגרפיה (ראו למטה), וצבע שלישי — תכלת —
# שנכנס עם ה-v2 richer-shell handoff בתור "מה שנמדד", לצד הענבר (פעולה,
# "גדול") והאלמוג (לב בלבד) שהיו כאן מההתחלה.
#
# כהה וקולנועי, כי זה מה שהתוכן: מוזיקת טריילרים. הרקע הכהה גם מבליט את
# עטיפות האלבומים ואת מדי העוצמה, שהם המידע שבאמת מבדיל בין תוצאות.
[theme]
base = "dark"
primaryColor = "#FFB020"
backgroundColor = "#0A0B0F"
secondaryBackgroundColor = "#14161D"
textColor = "#ECEEF3"
borderColor = "#1E2230"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
# שתי משפחות לפי ה-v2 richer-shell handoff: Sora לכותרות (וגם codeFont,
# כי אין כאן קוד אמיתי להציג — רק פקדים שה-theme מלביש) ו-Manrope לגוף.
#
# קודם ישבה כאן משפחה עגולה אחת (Nunito), מאורחת עצמאית ב-`static/fonts/`
# ולא ב-CDN. המעבר ל-Sora+Manrope דרך Google Fonts הוא בחירה מודעת של
# המשתמש, אחרי שהוצג לו הסיכון התיעודי ב-`app.py` ליד ה-CSS — קודם לכן
# הייתה כאן בדיוק נפילה כזו: גיליון סגנונות מ-Google Fonts שירד בהצלחה
# אבל קובץ הגופן שמאחוריו לא, והממשק כולו נפל בשקט לגופן ברירת המחדל.
# קובץ ה-Nunito עצמו הוסר: הוא לא נטען יותר משום מקום, ושמירת קובץ גופן
# מת "למקרה שצריך" היא בדיוק הניקוי הבא שלא נעשה.
#
# מה שהמונו נתן ולא נאבד: יישור הספרות בין השורות. `font-variant-numeric:
# tabular-nums` יושב ב-`app.py` על כל אזור התוכן, ולכן עמודת ציונים עדיין
# נקראת מלמעלה למטה בלי שהעין תקפוץ.
#
# הגופנים עצמם נטענים ב-`app.py`: ה-theme מקבל שם משפחה, לא כתובת.
font = "Manrope, sans-serif"
headingFont = "Sora, sans-serif"
codeFont = "Sora, sans-serif"
# קישורים בצבע הטקסט המשני ולא בכחול ברירת המחדל: שם השיר הוא קישור
# ל-YouTube Music, והוא צריך להיקרא ככותרת — לא כקישור צועק. ה-hover
# (ב-CSS) הוא מה שמסמן שהוא לחיץ.
linkColor = "#C3C8D4"
linkUnderline = false

# הגשת `static/` על ידי Streamlit — עדיין דלוקה גם בלי Nunito פעיל:
# עטיפות ברירת מחדל ונכסים אחרים עשויים להישען עליה בעתיד, וכיבוי סתם
# כדי לחסוך שורה הוא בדיוק סוג הניקוי שנראה בטוח ואינו.
[server]
enableStaticServing = true
