# ערכת הנושא של האפליקציה. זו הדרך המובנית של Streamlit, ולכן היא חלה גם על
# רכיבים שאין לנו CSS עליהם (בוררים, popover, סרגל הצד) — בניגוד להזרקת CSS,
# שמכסה רק את מה שנזכרנו לכסות.
#
# הערכים מגיעים מטבלת הטוקנים ב-`design_handoff_cover_lover/README.md`
# (כיוון 1a — STUDIO), והם ערכי כוונה סופיים ולא הצעה: שינוי כאן הוא סטייה
# מהעיצוב, לא כוונון. היוצא מן הכלל היחיד הוא הטיפוגרפיה, שהוחלפה
# במפורש על ידי המשתמש למשפחה עגולה אחת — ראו את הערת ה-superseded
# בסעיף Typography של אותו README.
#
# כהה וקולנועי, כי זה מה שהתוכן: מוזיקת טריילרים. הרקע הכהה גם מבליט את
# עטיפות האלבומים ואת מדי העוצמה, שהם המידע שבאמת מבדיל בין תוצאות.
# ענבר ואלמוג הם שני האקסנטים היחידים: ענבר לפעולה ראשית ולמדרגת "גדול",
# אלמוג ללב בלבד. אקסנט שמופיע על כל שורה מפסיק לסמן משהו.
[theme]
base = "dark"
primaryColor = "#FFB020"
backgroundColor = "#0A0B0F"
secondaryBackgroundColor = "#14161D"
textColor = "#ECEEF3"
borderColor = "#1E2230"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
# משפחה אחת לכל דבר: Nunito, סאנס עגול עם טווח משקלים 400–800. קודם ישבו
# כאן שלוש (Bricolage לכותרות, Instrument Sans לגוף, JetBrains Mono לכל
# מספר), וההפרדה הוחלפה בבקשת המשתמש אחרי רפרנס שבו הטיפוגרפיה כולה
# משפחה עגולה אחת: ההיררכיה נישאת בגודל ובמשקל ולא בהחלפת גופן.
#
# מה שהמונו נתן ולא נאבד: יישור הספרות בין השורות. `font-variant-numeric:
# tabular-nums` יושב ב-`app.py` על כל אזור התוכן, ולכן עמודת ציונים עדיין
# נקראת מלמעלה למטה בלי שהעין תקפוץ.
#
# הגופן עצמו נטען ב-`app.py`: ה-theme מקבל שם משפחה, לא כתובת.
font = "Nunito, sans-serif"
headingFont = "Nunito, sans-serif"
codeFont = "Nunito, sans-serif"
# קישורים בצבע הטקסט המשני ולא בכחול ברירת המחדל: שם השיר הוא קישור
# ל-YouTube Music, והוא צריך להיקרא ככותרת — לא כקישור צועק. ה-hover
# (ב-CSS) הוא מה שמסמן שהוא לחיץ.
linkColor = "#C3C8D4"
linkUnderline = false

# הגשת `static/` על ידי Streamlit. זו הדרך שבה קבצי הגופן מגיעים
# לדפדפן בלי תלות ב-Google Fonts — ראו את ההערה ליד ה-`@font-face`
# ב-`app.py`.
[server]
enableStaticServing = true
